name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Get tag version
      id: tag_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $VERSION"

    - name: Get Cargo.toml version
      id: cargo_version
      shell: bash
      run: |
        CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT
        echo "Cargo.toml version: $CARGO_VERSION"

    - name: Validate version consistency
      shell: bash
      run: |
        TAG_VERSION="${{ steps.tag_version.outputs.version }}"
        CARGO_VERSION="${{ steps.cargo_version.outputs.version }}"
        
        echo "Comparing versions:"
        echo "  Tag version: $TAG_VERSION"
        echo "  Cargo.toml version: $CARGO_VERSION"
        
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "❌ ERROR: Version mismatch detected!"
          echo "The git tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
          echo ""
          echo "To fix this:"
          echo "1. Update Cargo.toml version to match the tag, OR"
          echo "2. Delete this tag and create a new one with the correct version"
          echo "3. Use scripts/release.sh to automate releases safely"
          exit 1
        fi
        
        echo "✅ Version consistency check passed!"

    - name: Validate Cargo.lock is in sync
      shell: bash
      run: |
        if ! cargo metadata --locked --format-version 1 > /dev/null; then
          echo "❌ ERROR: Cargo.lock is out of sync with Cargo.toml!"
          echo "The release build uses --locked and would fail on every platform."
          echo ""
          echo "To fix this:"
          echo "1. Run 'cargo update --workspace' and commit Cargo.lock"
          echo "2. Delete this tag and re-tag the fixed commit"
          echo "3. Use scripts/release.sh to automate releases safely"
          exit 1
        fi
        echo "✅ Cargo.lock is in sync!"

  build-release:
    name: Build Release
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `platform` is the user-facing archive name; `target` stays the
        # Rust triple used for building. install.sh detects platforms by
        # these names — keep them in sync.
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          platform: linux-x86_64
          binary_name: sphinx-ultra
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          platform: linux-x86_64-musl
          binary_name: sphinx-ultra
          use_cross: true
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          platform: linux-aarch64
          binary_name: sphinx-ultra
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          platform: windows-x86_64
          binary_name: sphinx-ultra.exe
        - os: macos-latest
          target: x86_64-apple-darwin
          platform: macos-x86_64
          binary_name: sphinx-ultra
        - os: macos-latest
          target: aarch64-apple-darwin
          platform: macos-aarch64
          binary_name: sphinx-ultra

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Get the release version from the tag
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # cross builds in a container with a complete musl toolchain, so the
    # build cannot break when the runner image or host toolchain drifts
    - name: Install cross
      if: matrix.use_cross
      uses: taiki-e/install-action@cross

    - name: Build release binary
      run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --locked --release --target ${{ matrix.target }}

    - name: Strip release binary (linux and macos)
      if: matrix.os != 'windows-latest'
      run: strip "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

    - name: Build archive
      shell: bash
      run: |
        staging="sphinx-ultra-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}"
        mkdir -p "$staging"

        cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$staging/"
        cp {README.md,LICENSE,CHANGELOG.md} "$staging/"

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a "$staging.zip" "$staging"
          echo "ASSET=$staging.zip" >> $GITHUB_ENV
        else
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
        fi

    - name: Generate checksum
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
        else
          shasum -a 256 "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
        fi
        cat "${{ env.ASSET }}.sha256"

    - name: Upload release archive
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ env.ASSET }}
          ${{ env.ASSET }}.sha256

  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, build-release]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check for crates.io token
      id: check_token
      run: |
        if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
          echo "has_token=false" >> $GITHUB_OUTPUT
          echo "::notice::Skipping crates.io publishing - CARGO_REGISTRY_TOKEN not set"
        else
          echo "has_token=true" >> $GITHUB_OUTPUT
        fi

    - name: Publish to crates.io
      if: steps.check_token.outputs.has_token == 'true'
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Show crates.io setup instructions
      if: steps.check_token.outputs.has_token == 'false'
      run: |
        echo "ℹ️ Skipping crates.io publishing because CARGO_REGISTRY_TOKEN is not set"
        echo ""
        echo "To enable automatic crates.io publishing:"
        echo "1. Generate a token at https://crates.io/me"
        echo "2. Add it as a secret named CARGO_REGISTRY_TOKEN in your GitHub repository"
        echo "3. Go to: Settings → Secrets and variables → Actions → New repository secret"
        echo ""
        echo "For now, you can publish manually with:"
        echo "  cargo publish"
