# pre-commit hooks (https://pre-commit.com). Install with `pre-commit install`,
# or use `scripts/dev.sh install-hooks`, which runs the same cargo gates without
# the framework. Flags match CI (.github/workflows/ci.yml).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      # clippy/check depend on the manifests and toolchain pin as well as on
      # .rs, so they match a files regex rather than types: [rust]. pre-commit
      # ANDs files with types, so listing both would narrow instead of widen.
      - id: cargo-clippy
        name: cargo clippy
        description: Run Clippy with CI's flags
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        files: '(\.rs$|^Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$)'
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code for errors
        entry: cargo check --locked --all-targets --all-features
        language: system
        files: '(\.rs$|^Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$)'
        pass_filenames: false

      # Bytecode caches are build output, never source. check-added-large-files
      # cannot catch them: its default threshold is 500 KB and a .pyc is ~37 KB.
      - id: no-compiled-python
        name: block compiled Python artifacts
        description: Reject __pycache__/ and *.pyc so generator bytecode cannot be committed
        entry: >-
          compiled Python artifacts are build output and must not be committed
          (see the Python block in .gitignore)
        language: fail
        files: '((^|/)__pycache__/|\.py[cod]$)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tests/fixtures/'
      - id: end-of-file-fixer
        exclude: '^tests/fixtures/'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: '^tests/fixtures/'
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '^tools/.*\.py$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '^scripts/'
