[package]
name = "sphinx-ultra"
version = "0.4.0"
edition = "2021"
authors = ["Sphinx Ultra Team <sinan@alioglu.org>"]
description = "High-performance Rust-based Sphinx documentation builder for large codebases"
license = "MIT"
readme = "README.md"
homepage = "https://salioglu.github.io/sphinx-ultra"
repository = "https://github.com/salioglu/sphinx-ultra"
documentation = "https://salioglu.github.io/sphinx-ultra"
rust-version = "1.85"
keywords = ["documentation", "sphinx", "rst", "markdown", "builder"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [
    "/target",
    "/.github",
    "/docs",
    "/benches",
    "/scripts",
    "/dist",
    "/examples/basic",
    "/tests",
    "*.sh",
    "/sphinx-ultra.yaml",
    "/static/*.md",
]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# File system and I/O
tempfile = "3.0"

# String processing and templating
regex = "1.0"
lazy_static = "1.4"
pulldown-cmark = "0.13"
unicode-normalization = "0.1"

# Performance and concurrency
rayon = "1.0"
dashmap = "6.1"
parking_lot = "0.12"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Hashing and caching
blake3 = "1.0"

# HTML and web
html-escape = "0.2"

# Compression (objects.inv inventory format)
flate2 = "1.0"

# Template engine ("loader" enables owned template storage in the Environment)
minijinja = { version = "2.12", features = ["loader"] }

# Base64 encoding
base64 = "0.23"

# Path utilities
pathdiff = "0.2"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.0"

[[bin]]
name = "sphinx-ultra"
path = "src/main.rs"

[[example]]
name = "constraint_validation"
path = "examples/constraint_validation.rs"

[[example]]
name = "domain_validation"
path = "examples/domain_validation.rs"

[[example]]
name = "directive_validation"
path = "examples/directive_validation.rs"

[[bench]]
name = "builder_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 2
